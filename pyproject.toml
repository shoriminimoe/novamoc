[project]
name = "novamoc"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sam Caldwell", email = "shoriminimoe+git@pm.me" }
]
requires-python = ">=3.14"
dependencies = [
    "advanced-alchemy>=1.9.3",
    "aiosqlite>=0.22.1",
    "granian>=2.7.4",
    "litestar>=2.21.1",
    "litestar-granian>=0.15.0",
    "litestar-vite>=0.22.1",
    "sqlalchemy[aiosqlite,asyncio]>=2.0.49",
]

[build-system]
requires = ["uv_build>=0.10.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src/py"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.12",
    "ty>=0.0.34",
]

[tool.ruff]
src = ["src/py", "tests"]
target-version = "py314"

[tool.ruff.lint]
select = [
    # Correctness / bugs
    "E", "W", "F",
    "B",       # flake8-bugbear
    "ASYNC",   # flake8-async
    "RUF",     # ruff-native (RUF012 mutable class default, etc.)
    "PL",      # pylint (errors + warnings + refactor + convention)

    # Modernization (Python 3.14)
    "UP",      # pyupgrade
    "FURB",    # refurb

    # Imports
    "I",       # isort
    "TID",     # tidy-imports — bans relative parent imports
    "TC",      # type-checking — moves typing-only imports under TYPE_CHECKING
    "ICN",     # import conventions

    # Cleanups / style
    "C4",      # comprehensions
    "SIM",     # simplify
    "PIE",     # misc anti-patterns
    "RET",     # return cleanup
    "RSE",     # raise cleanup
    "PERF",    # perflint
    "N",       # pep8-naming
    "PT",      # pytest style

    # Domain hygiene
    "DTZ",     # tz-aware datetimes (relevant for HLC + audit columns)
    "PTH",     # use pathlib

    # Exception / logging hygiene
    "BLE",     # blind except
    "LOG",     # logging best practices
    "G",       # logging format
    "TRY",     # tryceratops
    "ERA",     # commented-out code

    # Security & private access
    "S",       # bandit
    "SLF",     # private-member access
    "A",       # builtin shadowing
]
ignore = [
    # `ruff format` owns these — Ruff explicitly recommends not enabling them
    "COM812",
    "ISC001",
    # `assert` is pytest's idiom; src code shouldn't rely on it but flagging
    # every test is pure noise.
    "S101",
]

[tool.ruff.lint.per-file-ignores]
# Magic numbers in test bodies are how tests are written.
"tests/**/*.py" = ["PLR2004"]
# `id` column on SQLAlchemy models legitimately shadows the builtin via the
# UUIDPrimaryKey mixin in advanced-alchemy.
"src/py/novamoc/db/models/**/*.py" = ["A003"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.lint.isort]
known-first-party = ["novamoc", "tests"]

[tool.ty.environment]
root = ["./src/py"]
# Project root added so ty can resolve cross-file imports inside tests/
# (e.g. ``from tests.data.loader import load_scenario``). extra-paths only
# affects module resolution, not which files ty type-checks.
extra-paths = ["./"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    # advanced-alchemy 1.9.x calls its own deprecated `set_async_context()`
    # from the Litestar plugin's `provide_session` (and other framework
    # extensions). The function is a no-op stub that only warns; the call
    # site is still on `main` upstream and there's no tracking issue yet.
    # Drop this entry once advanced-alchemy ships a fix and we upgrade.
    "ignore:Call to deprecated function 'set_async_context'.*:DeprecationWarning:advanced_alchemy._listeners",
]

[project]
name = "novamoc"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sam Caldwell", email = "shoriminimoe+git@pm.me" }
]
requires-python = ">=3.14"
dependencies = [
    "advanced-alchemy>=1.9.3",
    "aiosqlite>=0.22.1",
    "argon2-cffi>=23.1.0",
    "click>=8.1.7",
    "granian>=2.7.4",
    "litestar>=2.21.1",
    "litestar-granian>=0.15.0",
    "litestar-vite>=0.22.1",
    "msgspec-ext>=0.5.1",
    "sqlalchemy[aiosqlite,asyncio]>=2.0.49",
]

[project.scripts]
novamoc = "novamoc.cli:main"

[build-system]
requires = ["uv_build>=0.10.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src/py"
# Ship per-code problem-details HTML as wheel data alongside the package.
# ``just render-problem-docs`` writes flat ``<code>.html`` files into
# ``build/wheel_data/novamoc/html/``; uv_build's purelib data scheme
# preserves that subtree, landing them at
# ``<site-packages>/novamoc/html/<code>.html`` in a wheel install.
# Editable installs do not materialize wheel data, so the runtime falls
# back to the build-artifact tree (see ``novamoc.config``).
data = { "purelib" = "build/wheel_data" }

[dependency-groups]
dev = [
    "hypothesis>=6.0.0",
    "markdown-it-py>=3.0.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.15.12",
    "ty>=0.0.34",
]

[tool.ruff]
src = ["src/py", "tests"]
target-version = "py314"

[tool.ruff.lint]
select = [
    # Correctness / bugs
    "E", "W", "F",
    "B",       # flake8-bugbear
    "ASYNC",   # flake8-async
    "RUF",     # ruff-native (RUF012 mutable class default, etc.)
    "PL",      # pylint (errors + warnings + refactor + convention)

    # Modernization (Python 3.14)
    "UP",      # pyupgrade
    "FURB",    # refurb

    # Imports
    "I",       # isort
    "TID",     # tidy-imports — bans relative parent imports
    "TC",      # type-checking — moves typing-only imports under TYPE_CHECKING
    "ICN",     # import conventions

    # Cleanups / style
    "C4",      # comprehensions
    "SIM",     # simplify
    "PIE",     # misc anti-patterns
    "RET",     # return cleanup
    "RSE",     # raise cleanup
    "PERF",    # perflint
    "N",       # pep8-naming
    "PT",      # pytest style

    # Domain hygiene
    "DTZ",     # tz-aware datetimes (relevant for HLC + audit columns)
    "PTH",     # use pathlib

    # Exception / logging hygiene
    "BLE",     # blind except
    "LOG",     # logging best practices
    "G",       # logging format
    "TRY",     # tryceratops
    "ERA",     # commented-out code

    # Security & private access
    "S",       # bandit
    "SLF",     # private-member access
    "A",       # builtin shadowing
]
ignore = [
    # `ruff format` owns these — Ruff explicitly recommends not enabling them
    "COM812",
    "ISC001",
    # `assert` is pytest's idiom; src code shouldn't rely on it but flagging
    # every test is pure noise.
    "S101",
]
# Enable `from __future__ import annotations` imports
future-annotations = true

[tool.ruff.lint.per-file-ignores]
# Reserved for glob patterns matching multiple files. Specific-file ignores
# belong in a module-level `# ruff: noqa: <CODE>` comment near the top of
# the file with rationale alongside.
#
# Magic numbers in test bodies are how tests are written. Tests are allowed to
# reference private members.
"tests/**/*.py" = ["PLR2004", "SLF001"]
# `id` column legitimately shadows the builtin (advanced-alchemy
# UUIDPrimaryKey mixin). Runtime resolution of `Mapped[T]` is handled
# by `[tool.ruff.lint.flake8-type-checking].runtime-evaluated-base-classes`.
"src/py/novamoc/db/models/**/*.py" = ["A003"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.lint.flake8-type-checking]
# Frameworks below introspect class field annotations at runtime. Their
# subclasses keep field-type imports at runtime; TC001/2/3 must not push
# them under `if TYPE_CHECKING:`. Listing them here teaches ruff to skip
# those classes by inheritance rather than relying on per-file or
# module-level noqa. Plain @dataclass does NOT need to be exempted —
# field annotations are not runtime-resolved (ruff already handles
# ClassVar / InitVar) — and is intentionally not listed.
runtime-evaluated-base-classes = [
    # advanced-alchemy declarative bases — SQLAlchemy resolves Mapped[T] at
    # mapper-configuration time.
    "advanced_alchemy.base.UUIDAuditBase",
    "advanced_alchemy.base.UUIDBase",
    "advanced_alchemy.base.DefaultBase",
    # msgspec serialization / decoding introspects struct fields.
    "msgspec.Struct",
]
runtime-evaluated-decorators = [
    "sqlalchemy.orm.declarative_mixin",
    # Litestar handler decorators introspect the decorated method's
    # signature at request time (via get_type_hints) to decode the body
    # and bind parameters, so imports used in handler annotations must
    # stay runtime imports — TC001's TYPE_CHECKING autofix would break
    # wire decoding.
    "litestar.post",
    "litestar.get",
]

[tool.ruff.lint.isort]
known-first-party = ["novamoc", "tests"]

[tool.ty.environment]
root = ["./src/py"]
# Project root added so ty can resolve cross-file imports inside tests/
# (e.g. ``from tests.data.loader import load_scenario``). ``./scripts``
# lets ty resolve the build-time renderer module that the test fixture
# imports without it shipping in the wheel. extra-paths only affects
# module resolution, not which files ty type-checks.
extra-paths = ["./", "./scripts"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# ``scripts`` carries the build-time problem-docs renderer, which the test
# fixture imports to render HTML before the app boots. The directory is
# not a package and does not ship in the wheel.
pythonpath = ["scripts"]
addopts = "-ra"
markers = [
    "no_tenant: opt out of the autouse `tenant` fixture's contextvar setup",
]
filterwarnings = [
    # advanced-alchemy 1.9.x calls its own deprecated `set_async_context()`
    # from the Litestar plugin's `provide_session` (and other framework
    # extensions). The function is a no-op stub that only warns; the call
    # site is still on `main` upstream and there's no tracking issue yet.
    # Drop this entry once advanced-alchemy ships a fix and we upgrade.
    "ignore:Call to deprecated function 'set_async_context'.*:DeprecationWarning:advanced_alchemy._listeners",
]

[tool.coverage.run]
# Import name (resolved via the editable install). Tests and scripts/ live
# outside this package and are excluded by virtue of not being included.
source = ["novamoc"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
# Ratchet enforces the floor; don't have coverage.py duplicate-fail.
fail_under = 0
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.coverage.xml]
output = "coverage.xml"

[tool.coverage.html]
directory = "htmlcov"

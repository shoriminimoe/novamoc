[project]
name = "novamoc"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sam Caldwell", email = "shoriminimoe+git@pm.me" }
]
requires-python = ">=3.14"
dependencies = [
    "advanced-alchemy>=1.9.3",
    "aiosqlite>=0.22.1",
    "granian>=2.7.4",
    "litestar>=2.21.1",
    "litestar-granian>=0.15.0",
    "litestar-vite>=0.22.1",
    "sqlalchemy[aiosqlite,asyncio]>=2.0.49",
]

[build-system]
requires = ["uv_build>=0.10.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src/py"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[tool.ty.environment]
root = ["./src/py"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra"

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-py:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: extractions/setup-just@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # `uv sync` builds novamoc via uv_build, which walks `build/wheel_data/`.
      # Create the dir first so the sync succeeds on a fresh checkout.
      - run: mkdir -p build/wheel_data
      - run: uv sync

      # `--exit-zero` so the ratchet job is the gate, not this step. The
      # JSON output drives both the `::error` annotations and the summary
      # table emitted by ci_summary.py.
      - name: Run ruff
        run: uv run ruff check --no-fix --exit-zero --output-format=json . > ruff.json
      - name: Summarize ruff
        if: always()
        run: uv run python scripts/ci_summary.py ruff ruff.json

  typecheck-py:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: extractions/setup-just@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - run: mkdir -p build/wheel_data
      - run: uv sync

      # ty has no `github` output format; we use `gitlab` (JSON) and
      # convert to annotations + table in ci_summary.py. `--exit-zero`
      # keeps the tool step from short-circuiting before the summary;
      # the summary step inspects the file and exits non-zero on error.
      - name: Run ty
        run: uv run ty check --output-format=gitlab --exit-zero > ty.json
      - name: Summarize ty
        if: always()
        run: uv run python scripts/ci_summary.py ty ty.json
      - name: Fail on type errors
        run: |
          set -e
          test "$(cat ty.json)" = "[]"

  typecheck-js:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: extractions/setup-just@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/js/web/package-lock.json

      - run: cd src/js/web && npm ci

      # `just typecheck-js` runs `svelte-kit sync` (generates ambient
      # declarations the typecheck needs), `svelte-check`, and `tsc -p
      # tsconfig.node.json`. Failures from any of the three fail this step.
      - run: just typecheck-js

  coverage-py:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: extractions/setup-just@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - run: mkdir -p build/wheel_data
      - run: uv sync
      - run: just render-problem-docs

      - run: just coverage-py
      - name: Summarize pytest
        if: always()
        run: uv run python scripts/ci_summary.py pytest pytest-junit.xml coverage.xml

      - name: Upload python coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-py
          path: |
            coverage.xml
            htmlcov/
          retention-days: 14

  coverage-js:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: extractions/setup-just@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/js/web/package-lock.json

      # ci_summary.py is a Python script, so the JS job still needs uv +
      # the venv for that step. The cache makes the sync ~free.
      - run: mkdir -p build/wheel_data
      - run: uv sync
      - run: cd src/js/web && npm ci

      - run: just coverage-js
      - name: Summarize vitest
        if: always()
        run: uv run python scripts/ci_summary.py vitest src/js/web/vitest-junit.xml src/js/web/coverage/coverage-summary.json

      - name: Upload js coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-js
          path: src/js/web/coverage/
          retention-days: 14

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: extractions/setup-just@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/js/web/package-lock.json

      # e2e boots the real Python API, so the job needs the uv venv too.
      - run: mkdir -p build/wheel_data
      - run: uv sync
      - run: cd src/js/web && npm ci

      - run: cd src/js/web && npx playwright install --with-deps chromium
      - run: just test-e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: src/js/web/playwright-report/
          retention-days: 14

  ratchet:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [coverage-py, coverage-js]
    steps:
      - uses: actions/checkout@v6
      - uses: extractions/setup-just@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - run: mkdir -p build/wheel_data
      - run: uv sync

      - uses: actions/download-artifact@v8
        with:
          name: coverage-py
      - uses: actions/download-artifact@v8
        with:
          name: coverage-js
          path: src/js/web/coverage/

      # `just ratchet` writes its own table to $GITHUB_STEP_SUMMARY
      # (see scripts/ratchet.py).
      - run: just ratchet
